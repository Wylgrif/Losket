// Patches de DEVELOPPEMENT de Losket.

// Previsualisation : curseurs de reglage du shader dans le menu clic-droit,
// sur les capsules stock. Sera supprime une fois le rendu fige.
@PART[mk1pod_v2|mk1-3pod]:FOR[Losket]
{
	MODULE
	{
		name = ModuleLosketBurnPreview
	}
}

// Accumulation en vol : toutes les pieces. Le module est inerte tant que la
// piece ne subit pas de flux (overlay cree au premier 2 % de brulure), donc le
// cout sur un vaisseau propre est nul. Les kerbals en EVA et les asteroides
// sont exclus : leurs "pieces" ne sont pas des coques.
@PART[*]:HAS[!MODULE[KerbalEVA],!MODULE[ModuleAsteroid],!MODULE[ModuleComet]]:FOR[Losket]
{
	MODULE
	{
		name = ModuleLosketBurn
	}
	MODULE
	{
		name = ModuleLosketDust
	}
}
