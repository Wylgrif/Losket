// Patches de DEVELOPPEMENT de Losket.

// Previsualisation : curseurs de reglage du shader dans le menu clic-droit,
// sur les capsules stock. Sera supprime une fois le rendu fige.
@PART[mk1pod_v2|mk1-3pod]:FOR[Losket]
{
	MODULE
	{
		name = ModuleLosketBurnPreview
	}
}

// Accumulation en vol : capsules, boucliers et quelques reservoirs pour tester
// une rentree reelle. S'etendra a toutes les pieces via un patch generique une
// fois valide.
@PART[mk1pod_v2|mk1-3pod|HeatShield0|HeatShield1|HeatShield2|HeatShield3|fuelTank*|Rockomax*|solidBooster*]:FOR[Losket]
{
	MODULE
	{
		name = ModuleLosketBurn
	}
}
