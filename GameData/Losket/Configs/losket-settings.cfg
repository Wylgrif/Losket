// Reglages globaux de Losket sans interface en jeu.
//
// Ces valeurs sont lues au demarrage et ne sont pas exposees dans le menu des
// parametres de partie : l'espace a l'ecran est reserve aux choix quotidiens.
// Un patch ModuleManager peut les surcharger :
//
//   @LOSKET_SETTINGS { @dustMinPressureAtm = 0 }

LOSKET_SETTINGS
{
	// Pression (en atmospheres) en dessous de laquelle les moteurs ne
	// soulevent plus de poussiere. Par defaut la poussiere est desactivee dans
	// le vide : techniquement fonctionnelle, elle n'a pas convaincu a l'usage
	// (gerbe rasante sur les flancs peu lisible). Mettre 0 pour la retablir
	// partout, y compris sur la Mun et Minmus. La case "Poussiere dans le
	// vide" des reglages de Losket fait la meme chose sans patch ; ce seuil
	// ne s'applique que lorsqu'elle est decochee.
	dustMinPressureAtm = 0.01

	// Tempetes de poussiere de Volumetric Clouds (Blackrack). Sans ce mod,
	// ces valeurs n'ont aucun effet. Un vaisseau dans une tempete se couvre
	// de la poussiere de l'astre, meme pose sur une piste et en acceleration
	// du temps.
	stormDust = true
	// Une couche de nuages compte comme tempete si son nom contient ce mot.
	stormLayerKeyword = dust
	// Couverture de la couche (0..1) : sous le minimum, hors tempete ; au
	// maximum, tempete pleine.
	stormCoverageMin = 0.2
	stormCoverageMax = 0.75
	// Secondes de jeu dans une tempete pleine pour couvrir une piece a ~63 %.
	stormDustTime = 7200
}

// Poids par couche de nuages : multiplie la poussiere deposee par cette
// couche (1 sans entree, 0 pour l'ignorer). Les voiles de poussiere diffuse
// de Duna sont tres fins a cote des grandes tempetes : cinq fois moins.
// Les packs de planetes peuvent ajouter leurs couches par patch MM, une cle
// par ligne (un noeud ecrit sur une seule ligne n'est pas lu par KSP).
LOSKET_STORM_LAYER
{
	name = Duna-dust-scattered
	weight = 0.2
}

LOSKET_STORM_LAYER
{
	name = Duna-duststorm-big
	weight = 1
}
