// Reglages globaux de Losket sans interface en jeu.
//
// Ces valeurs sont lues au demarrage et ne sont pas exposees dans le menu des
// parametres de partie : l'espace a l'ecran est reserve aux choix quotidiens.
// Un patch ModuleManager peut les surcharger :
//
//   @LOSKET_SETTINGS { @dustMinPressureAtm = 0 }

LOSKET_SETTINGS
{
	// Pression (en atmospheres) en dessous de laquelle les moteurs ne
	// soulevent plus de poussiere. Par defaut la poussiere est desactivee dans
	// le vide : techniquement fonctionnelle, elle n'a pas convaincu a l'usage
	// (gerbe rasante sur les flancs peu lisible). Mettre 0 pour la retablir
	// partout, y compris sur la Mun et Minmus.
	dustMinPressureAtm = 0.01
}
