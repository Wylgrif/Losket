// Couleur de la poussiere soulevee, par corps celeste.
//
// Table volontairement declarative : echantillonner la texture du terrain ne
// correspondrait pas a ce que voit le joueur des que Parallax est installe.
// Les mods de planetes peuvent ajouter leurs corps avec un simple patch MM :
//
//   LOSKET_BODY_DUST
//   {
//       body = MonCorps
//       color = 0.5, 0.4, 0.3
//   }
//
// Une cle par ligne : KSP coupe une ligne au premier '=' seulement, un noeud
// ecrit sur une seule ligne n'est pas lu (le plugin tolere l'ancien format,
// mais sans garantie pour l'avenir).
//
// Sans entree, le plugin retombe sur un gris-brun neutre. La case "Couleur
// de poussiere par astre" des reglages de Losket, decochee, impose ce
// gris-brun partout : c'est aussi la couleur du nuage de Volumetric Ground FX.

// Brun neutre : la version plus chaude (0.42, 0.36, 0.28) tirait sur le
// jaune en jeu.
LOSKET_BODY_DUST
{
	body = Kerbin
	color = 0.42, 0.37, 0.32
}

LOSKET_BODY_DUST
{
	body = Mun
	color = 0.44, 0.43, 0.41
}

LOSKET_BODY_DUST
{
	body = Minmus
	color = 0.62, 0.68, 0.62
}

LOSKET_BODY_DUST
{
	body = Moho
	color = 0.38, 0.33, 0.29
}

LOSKET_BODY_DUST
{
	body = Eve
	color = 0.45, 0.35, 0.48
}

LOSKET_BODY_DUST
{
	body = Gilly
	color = 0.35, 0.31, 0.27
}

// Brun-tan rose, mesure sur les photos du rover Curiosity couvert de
// poussiere martienne. Essayes et rejetes en jeu : le rouge sombre
// (0.55, 0.33, 0.21), trop lourd, et l'ocre clair (1.0, 0.74, 0.47), qui
// virait a l'orange vif une fois la piece couverte.
