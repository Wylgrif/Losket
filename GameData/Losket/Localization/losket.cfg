// Traductions de Losket.
//
// KSP fusionne tous les noeuds Localization du GameData et selectionne la
// langue du jeu, avec repli automatique sur en-us pour toute balise manquante.
// Les libelles affiches vivent donc ici et JAMAIS dans le code C# : les
// fichiers .cs restent en ASCII pur, ce qui evite toute dependance a la page
// de codes du compilateur.
//
// Pour ajouter une langue : dupliquer un bloc et changer son code
// (de-de, es-es, ja, ru, it-it, pt-br...).

